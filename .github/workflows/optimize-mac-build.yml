name: Optimize Mac build

on:
  push:
    branches: ["optimize/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source formatting
        run: npm run format:check
      - name: Build shared packages
        run: |
          npm run build:server
          npm run build:app-deps
      - name: Check types and lint
        run: |
          npm run typecheck
          npm run lint
      - name: Verify Pi runtime and isolated settings
        working-directory: packages/server
        run: >-
          npx vitest run
          src/server/agent/optimize-provider-registry.test.ts
          src/server/optimize-config.test.ts
          src/server/agent/providers/pi/agent.test.ts
          src/server/agent/providers/pi/cli-runtime.test.ts
          src/server/agent/providers/pi/history-mapper.test.ts
          --bail=1
      - name: Verify branded desktop packaging and navigation
        working-directory: packages/desktop
        run: npx vitest run src/daemon/desktop-packaging.test.ts src/agent-navigation.test.ts src/window/window-manager.test.ts --bail=1
      - name: Verify deep links
        working-directory: packages/protocol
        run: npx vitest run src/agent-deep-link.test.ts --bail=1
      - name: Verify appearance
        working-directory: packages/app
        run: npx vitest run src/styles/theme.test.ts --project=unit --bail=1
      - name: Bundle and package the Optimize app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          (cd packages/app && PASEO_WEB_PLATFORM=electron npx expo export --platform web)
          npm run build:main --workspace=@getpaseo/desktop
          (cd packages/desktop && npx electron-builder --config electron-builder.yml --publish never --mac --arm64 --dir -c.mac.identity=- -c.mac.notarize=false)
      - name: Launch packaged app and verify its daemon and terminal
        env:
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/optimize-smoke
        run: node packages/desktop/e2e/packaged-app-smoke.js --app packages/desktop/release/mac-arm64/Optimize.app
      - name: Archive the Mac app
        run: ditto -c -k --sequesterRsrc --keepParent packages/desktop/release/mac-arm64/Optimize.app packages/desktop/release/Optimize-0.8.0-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Optimize-Mac-Apple-Silicon
          path: packages/desktop/release/Optimize-0.8.0-arm64.zip
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Optimize-build-diagnostics
          path: ${{ runner.temp }}/optimize-smoke
          if-no-files-found: ignore
          retention-days: 7
